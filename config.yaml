niche:
  name: "Ký ức tuổi thơ 8x 9x"
  description: >
    Những thước phim ngắn gợi lại tuổi thơ thế hệ 8x 9x: trò chơi, quà vặt, đồ vật, trường lớp, Tết,
    làng quê, những buổi chiều bên ông bà cha mẹ. Mỗi video đánh thức một ký ức cụ thể (âm thanh, mùi vị,
    cảm giác) để người xem mỉm cười, thấy ấm lòng và trân quý gia đình, hiện tại.
  audience: "Người Việt 25–45 tuổi, thế hệ 8x 9x, đã đi làm xa nhà hoặc đã lập gia đình"
  tone: "Hoài niệm, ấm áp, chậm rãi, chân thành; câu ngắn gợi hình; không sến, không giáo điều; kết bằng một cảm xúc tích cực"
  # Trụ cột nội dung — kế hoạch 30 ngày xoay vòng giữa các nhóm này
  pillars:
    - "Trò chơi tuổi thơ"
    - "Quà vặt & món ăn xưa"
    - "Đồ vật xưa trong nhà"
    - "Trường lớp & thầy cô"
    - "Tết & mùa lễ hội"
    - "Làng quê & thiên nhiên"
    - "Gia đình, ông bà, cha mẹ"
  # Phong cách của kênh mẫu — Claude bắt chước CÁCH TRÌNH BÀY, không chép nội dung.
  # Xem vài video của kênh mẫu rồi sửa đoạn này cho sát (chỉ cần tiếng Việt, càng cụ thể càng tốt).
  style_reference: >
    Kênh mẫu: @kyuc.tuoitho.8x9x. Video 15–30 giây gồm các clip AI 8 giây, bối cảnh Việt Nam thập niên 1990.
    KHÔNG có người dẫn chuyện: các nhân vật trong gia đình nói chuyện với nhau bằng những câu thoại ngắn, đời
    thường, có cảm xúc (trêu đùa, hỏi han, reo vui, thì thầm, nghẹn ngào); nhạc nền nhẹ nhàng, hoài niệm phía sau;
    phụ đề theo lời thoại. Mỗi video xoay quanh MỘT ký ức cụ thể, kết bằng một khoảnh khắc chạm cảm xúc và câu
    hỏi gợi bình luận trong caption.
  # Phong cách hình ảnh CỐ ĐỊNH cho mọi clip và mọi kế hoạch (tiếng Anh, dùng nguyên văn trong prompt)
  visual_style_en: >
    Cinematic anime feature-film style: hand-drawn 2D animation look, expressive anime faces, painterly richly
    detailed backgrounds, soft warm golden-hour light, gentle film grain, nostalgic muted color palette,
    1990s Vietnam

# 6 NHÂN VẬT CỐ ĐỊNH của kênh (một gia đình) — dùng nguyên văn trong mọi kịch bản và prompt clip để mặt, quần áo
# và giọng nói giống nhau giữa các clip. Đây là GIÁ TRỊ BAN ĐẦU: lần chạy đầu hệ thống chép sang data/nhan_vat.yaml,
# sau đó bạn sửa ở đó (hoặc qua Telegram: gửi ảnh kèm chú thích vai, /nhanvat, /giong) — cập nhật code không ghi đè.
#   look_en : ngoại hình + trang phục CỐ ĐỊNH (tiếng Anh). Trẻ em: KHÔNG ghi số tuổi (Google sẽ chặn).
#   voice_en: giọng CỐ ĐỊNH (tiếng Anh) cho Flow/Gemini lồng tiếng.   speech_vi: xưng hô, cách nói.
#   tts     : giọng cố định khi ghép (edge-tts). voice_type: girl|boy|female|male|old_female|old_male
cast:
  - key: ong
    name: "Ông"
    role: "Ông nội, hiền từ, hóm hỉnh, hay kể chuyện ngày xưa"
    aliases: ["ông nội"]
    look_en: >-
      Vietnamese grandfather, elderly man, thin kind face with smiling eyes and deep laugh lines, short neat white
      hair, thin white mustache, slightly stooped, faded light-brown collarless traditional cotton shirt with cloth
      buttons, loose dark-brown trousers, simple brown sandals
    voice_en: "deep, slightly husky elderly male voice, slow and warm, soft chuckle, Northern Vietnamese accent"
    speech_vi: "Xưng 'ông', gọi cháu là 'cháu' hoặc 'con'; nói chậm, hay cười khà khà, thích kể 'ngày xưa ấy mà…'"
    voice_type: old_male
    tts: {voice: "vi-VN-NamMinhNeural", pitch: "+5Hz", rate: "-5%"}
  - key: ba
    name: "Bà"
    role: "Bà nội, dịu dàng, chiều cháu, hay dặn dò"
    aliases: ["bà nội"]
    look_en: >-
      Vietnamese grandmother, elderly woman, round gentle face with a warm smile, grey hair in a low bun wrapped with a
      black velvet headband, dark-brown long-sleeved traditional blouse, black silk trousers, small green jade bracelet
      on her left wrist
    voice_en: "soft, warm elderly female voice, slow and tender, slightly raspy, Northern Vietnamese accent"
    speech_vi: "Xưng 'bà', gọi cháu là 'cháu' hoặc 'cục vàng của bà'; giọng ngọt, hay dặn 'từ từ thôi cháu'"
    voice_type: old_female
    tts: {voice: "vi-VN-HoaiMyNeural", pitch: "-15Hz", rate: "-5%"}
  - key: bo
    name: "Bố"
    role: "Bố, ít nói, chịu khó, hài hước kín đáo"
    aliases: []
    look_en: >-
      Vietnamese father in his late thirties, tanned skin, square jaw, short black side-parted hair, light stubble,
      olive-green short-sleeved shirt, khaki trousers, old silver wristwatch
    voice_en: "steady mid-low adult male voice, calm and kind, medium pace, Northern Vietnamese accent"
    speech_vi: "Xưng 'bố', gọi con là 'con', gọi ông bà là 'ông bà' khi nói với con; nói ngắn, hay trêu con"
    voice_type: male
    tts: {voice: "vi-VN-NamMinhNeural", pitch: "+20Hz", rate: "0%"}
  - key: me
    name: "Mẹ"
    role: "Mẹ, đảm đang, ân cần, hay mắng yêu"
    aliases: []
    look_en: >-
      Vietnamese mother in her mid thirties, oval face, gentle eyes, long straight black hair in a low ponytail,
      pale-blue floral cotton blouse, dark trousers
    voice_en: "gentle clear adult female voice, warm and caring, medium pace, Northern Vietnamese accent"
    speech_vi: "Xưng 'mẹ', gọi con là 'con'; ân cần, hay mắng yêu 'cái thằng này', 'con bé này'"
    voice_type: female
    tts: {voice: "vi-VN-HoaiMyNeural", pitch: "+10Hz", rate: "+5%"}
  - key: be_trai
    name: "Cu Tí"
    role: "Bé trai, anh, nghịch ngợm, hiếu động, thương em"
    aliases: ["tí", "bé trai"]
    look_en: >-
      Vietnamese little boy, slim, round face, big bright eyes, short spiky black hair with a cowlick, white
      short-sleeved shirt, navy-blue shorts, simple sandals
    voice_en: "bright energetic young boy voice, high-pitched, fast and playful, Northern Vietnamese accent"
    speech_vi: "Xưng 'con' với bố mẹ, 'cháu' với ông bà, 'anh' với em gái; hay khoe, hay reo 'ơ, hay quá!'"
    voice_type: boy
    tts: {voice: "vi-VN-NamMinhNeural", pitch: "+50Hz", rate: "+10%"}
  - key: be_gai
    name: "Bé Na"
    role: "Bé gái, em út, hồn nhiên, tò mò, hay hỏi"
    aliases: ["na", "bé gái"]
    look_en: >-
      Vietnamese little girl, small, round face with rosy cheeks, big curious eyes, short black bob hair with straight
      bangs and a small red hair clip, faded red cotton shirt with a white collar, dark-blue shorts
    voice_en: "sweet high-pitched little girl voice, giggly and curious, Northern Vietnamese accent"
    speech_vi: "Xưng 'con'/'cháu', gọi anh là 'anh Tí'; hồn nhiên, hay hỏi 'sao thế ạ?', 'thật á?'"
    voice_type: girl
    tts: {voice: "vi-VN-HoaiMyNeural", pitch: "+60Hz", rate: "-10%"}

# Kênh mẫu: học kỹ phong cách, nhịp, hook của các kênh này (ưu tiên hơn kênh tham khảo bên dưới)
reference_channels:
  - "kyuc.tuoitho.8x9x"

# Kênh tham khảo thêm (username TikTok, không có @) — học chủ đề và hook
competitors:
  - "ngayxuayenbinh"  # 1900 hồi đó — 355K follow, 4.2M tim
 
scraper:
  videos_per_profile: 30      # số video mới nhất lấy mỗi kênh
  lookback_days: 30           # chỉ phân tích video trong N ngày gần đây
  top_n_for_analysis: 25      # số video hiệu quả nhất gửi cho Claude phân tích

content:
  target_duration_sec: 24     # độ dài video mong muốn (kênh mẫu: 15–30 giây)
  scenes: 3                   # số cảnh mỗi video (2–6), mỗi cảnh = 1 clip 8 giây: 3 ≈ 24s, 4 ≈ 32s, 5 ≈ 40s. Đổi nhanh: /socanh 4
  videos_per_day: 1
  every_days: 1               # tần suất mặc định: N ngày ra 1 kịch bản/video (đổi nhanh trên Telegram: /tansuat 2)
  plan_days: 30               # số ngày mỗi kế hoạch (n8n + worker)

voice:
  name: "vi-VN-HoaiMyNeural"  # giọng mặc định
  options:                    # nút "🎙 Đổi giọng" khi duyệt kịch bản sẽ xoay vòng các giọng này
    - "vi-VN-HoaiMyNeural"    # nữ
    - "vi-VN-NamMinhNeural"   # nam
  rate: "-8%"                 # chậm hơn một chút cho cảm xúc
  # Giọng thoại khi ghép video (đổi nhanh bằng lệnh /giong trên Telegram):
  #   "clip"  = GIỮ NGUYÊN âm thanh từng clip Flow/Gemini (giọng, âm lượng, tốc độ y như clip), chỉ thêm nhạc nền
  #             nhỏ phía dưới + phụ đề; clip không có tiếng thì dùng giọng cố định (tts) của nhân vật. (khuyên dùng)
  #   "fixed" = THAY tiếng trong clip bằng giọng cố định (tts) của từng nhân vật → giọng giống nhau giữa mọi clip,
  #             nhưng khác âm lượng/tốc độ so với clip gốc
  dialogue_voice: "clip"
  # Các giọng để chọn trong /giong (nút "Đổi giọng" của từng nhân vật xoay vòng danh sách này);
  # cũng là giọng DỰ PHÒNG khi clip không có tiếng
  fallback:
    girl:       {voice: "vi-VN-HoaiMyNeural",  pitch: "+35Hz", rate: "+6%"}
    boy:        {voice: "vi-VN-NamMinhNeural", pitch: "+30Hz", rate: "+6%"}
    female:     {voice: "vi-VN-HoaiMyNeural",  pitch: "+0Hz",  rate: "-4%"}
    male:       {voice: "vi-VN-NamMinhNeural", pitch: "+0Hz",  rate: "-4%"}
    old_female: {voice: "vi-VN-HoaiMyNeural",  pitch: "-12Hz", rate: "-14%"}
    old_male:   {voice: "vi-VN-NamMinhNeural", pitch: "-12Hz", rate: "-14%"}

video:
  font: "DejaVu Sans"         # font phải hỗ trợ tiếng Việt
  # Nhạc nền: gửi file nhạc (mp3/m4a) vào Telegram cho bot → lưu vào data/music, mỗi video tự xoay vòng 1 bài.
  # Chỉ dùng nhạc KHÔNG BẢN QUYỀN (YouTube Audio Library, Pixabay Music…). Xem danh sách: /nhac
  background_music: ""        # (tuỳ chọn) cố định 1 file nhạc cho mọi video; để trống = xoay vòng thư viện
  music_dir: "music"          # thư mục nhạc trong data/
  music_volume: 0.15          # âm lượng nhạc nền (nhẹ, nằm dưới lời thoại)
  music_duck: true            # tự hạ nhỏ nhạc khi có giọng đọc
  fallback_query: "family warm sunset"

ai_video:
  enabled: true
  # Nguồn video AI:
  #   "manual_flow" = MIỄN PHÍ: bot gửi prompt qua Telegram, bạn tạo clip trên Google Flow
  #                   (labs.google/flow, ~50 credit miễn phí/ngày) rồi reply lại bằng file video
  #   "gemini_api"  = tự động hoàn toàn qua Gemini API (trả phí, cần GEMINI_API_KEY)
  provider: "manual_flow"
  # true = duyệt kịch bản xong, hệ thống TỰ tạo clip bằng Gemini API (trả phí, cần GEMINI_API_KEY) — luôn qua cổng
  # duyệt ngân sách: hết hạn mức thì bot hỏi bạn trên Telegram trước khi tiêu. Lỗi/hết hạn mức → chuyển sang tạo tay.
  auto_generate: true
  # Cảnh nào dùng AI, còn lại dùng Pixabay:
  #   "first" = chỉ cảnh mở đầu (hook) | "all" = tất cả | "none" = không dùng | [1, 3] = cảnh số 1 và 3
  scenes: "all"
  max_shot_sec: 8             # mỗi shot AI tối đa 8 giây (cảnh dài hơn sẽ tách nhiều shot)
  reference_images: true      # gửi kèm ảnh mẫu nhân vật (data/nhan_vat.yaml) cho Gemini để giữ đúng khuôn mặt
  chain_frames: true          # cảnh sau bắt đầu từ khung hình cuối của cảnh trước (liền mạch)

  manual:                     # dùng khi provider = manual_flow
    max_shots_per_day: 4      # 50 credit/ngày ÷ ~12 credit/clip 8s (Omni Flash 720p) ≈ 4 clip
    one_shot_per_scene: true  # mỗi cảnh đúng 1 clip 8s
    max_stretch: 1.25         # lời đọc dài hơn clip thì làm chậm clip tối đa 1.25 lần (không lặp clip)
    credits_per_shot: 12      # chỉ để ghi log ước tính
    daily_credits: 50

  # ---- dùng khi provider = gemini_api ----
  # Veo trên Gemini API đã bị Google tắt ngày 22/10/2026; Omni Flash là model thay thế.
  model: "gemini-omni-1.2-flash"
  resolution: "360p"          # 360p (rẻ nhất, ~$0.023/s) | 720p (~$0.07/s) | 1080p | 4k
  daily_limit_sec: 60         # tối đa số giây video AI mỗi ngày; vượt thì cảnh đó tự chuyển sang Pixabay
  timeout_sec: 900            # chờ tối đa mỗi shot
  poll_interval_sec: 10
  # Giá Gemini Omni 1.2 Flash (USD / 1 triệu token), dùng để ước tính chi phí ghi vào data/logs/ai_cost.jsonl
  price_per_1m_output_tokens: 12.0
  price_per_1m_input_tokens: 1.5

schedule:
  # Giờ chạy thật nằm trong workflow n8n (node "06:30 – kiểm tra kế hoạch" và "07:00 – gửi kịch bản").
  # Dòng dưới chỉ dùng cho bot Python cũ (python -m tiktok_agent.main bot).
  daily_time: "07:00"
  timezone: "Asia/Ho_Chi_Minh"

tiktok:
  # inbox  = đẩy vào hộp nháp TikTok, bạn bấm đăng trong app (dùng được ngay)
  # direct = đăng thẳng (cần app TikTok qua audit, nếu chưa thì chỉ đăng được SELF_ONLY)
  post_mode: "inbox"
  privacy_level: "PUBLIC_TO_EVERYONE"
  # Các kênh TikTok của bạn (tên tự đặt, không dấu, không khoảng trắng). Mỗi kênh kết nối 1 lần bằng lệnh /tiktok.
  # Video được duyệt sẽ được gửi lên TẤT CẢ các kênh đã kết nối.
  accounts:
    - "default"
    # - "kenh2"

# Ngân sách: mọi dịch vụ trả phí phải được bạn duyệt trên Telegram trước khi tiêu tiền.
# Hạn mức tháng = free_monthly_usd + số tiền bạn đã bấm "Duyệt". Vượt hạn mức → bot hỏi trước, không tự tiêu.
budget:
  services:
    claude:                   # Claude API — bắt buộc (viết kế hoạch + kịch bản), ~2–5 USD/tháng
      free_monthly_usd: 0
      suggest_monthly_usd: 5
      est_plan_usd: 0.8       # ước tính 1 lần lập kế hoạch 30 ngày
      est_script_usd: 0.15    # ước tính 1 kịch bản
      est_image_usd: 0.05     # ước tính đọc 1 ảnh nhân vật
      est_fix_usd: 0.03       # ước tính viết lại 1 prompt bị Flow chặn
      options_usd: [2, 5, 10] # các mức bạn chọn được khi bot xin duyệt ngân sách
      price_in_per_m: 4       # Claude Opus 5.5: $4 / 1 triệu token vào
      price_out_per_m: 20     #                  $20 / 1 triệu token ra
    apify:                    # quét đối thủ — gói Free của Apify tặng ~5 USD/tháng nên thường $0
      free_monthly_usd: 5
      suggest_monthly_usd: 2
      est_scrape_usd: 0.5
      options_usd: [1, 2, 5]
    gemini_video:             # tuỳ chọn: tạo clip tự động bằng Gemini API thay vì tạo tay trên Google Flow
      free_monthly_usd: 0
      suggest_monthly_usd: 5
      usd_per_clip: 0.19      # 1 video 3 cảnh ≈ $0.6 → $5 ≈ 8 video, $10 ≈ 17 video
      options_usd: [1, 5, 10, 25]

data_dir: "data"
