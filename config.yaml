niche:
  name: "Tuổi thơ & kỷ niệm gia đình"
  description: >
    Kênh kể những câu chuyện về tuổi thơ, kỷ niệm gia đình, những hồi ức đẹp,
    và năng lượng tích cực — giúp con cái nhớ về cha mẹ, vợ chồng nhớ lại những
    điều quý giá thay vì bị cuốn theo bộn bề cuộc sống hàng ngày.
  audience: "Người Việt 22–45 tuổi, đã đi làm xa nhà hoặc đã lập gia đình"
  tone: "Ấm áp, chậm rãi, chân thành, gợi nhớ; không sến, không giáo điều; kết bằng một thông điệp nhẹ nhàng"

# Kênh đối thủ / kênh tham khảo (username TikTok, không có @)
# Tìm qua Apify ngày 07/11/2026, số follow tại thời điểm đó.
competitors:
  # --- Kênh làm video hoài niệm bằng AI ---
  - "happybabyworld2026"       # Happy Baby World — 124K follow, hoạt hình 3D chuyện ông bà/cháu, tuổi thơ làng quê
  - "aique64"                  # Mekong Delta Vietnam — 113K follow, video AI tuổi thơ miền Tây thập niên 90 (#AI)
  - "cachsudungvo3ai"          # Làm video AI theo yêu cầu — 40K follow, video AI hoài niệm (#aihoainiem #klingai)
  - "inconmainhaxua1"          # Ỉn Con Và Mái Nhà Xưa — 28K follow, hoạt hình tuổi thơ 8x 9x (có thể dùng AI, chưa xác nhận)
  # --- Kênh hoài niệm 8x 9x lớn (không thấy dấu hiệu AI) — để học chủ đề & hook ---
  - "thehien.kyuc8x9x"         # KÝ ỨC 8X9X — 530K follow, 13M tim
  - "nammotnganchintramhoido"  # 1900 hồi đó — 355K follow, 4.2M tim

scraper:
  videos_per_profile: 30      # số video mới nhất lấy mỗi kênh
  lookback_days: 30           # chỉ phân tích video trong N ngày gần đây
  top_n_for_analysis: 25      # số video hiệu quả nhất gửi cho Claude phân tích

content:
  target_duration_sec: 30     # độ dài video mong muốn
  scenes: 4                   # số cảnh cố định: 4 cảnh × 1 clip AI 8 giây ≈ 28–32 giây (đặt 3 nếu muốn ~24 giây)
  videos_per_day: 1
  plan_days: 30               # số ngày mỗi kế hoạch (n8n + worker)

voice:
  name: "vi-VN-HoaiMyNeural"  # hoặc vi-VN-NamMinhNeural (giọng nam)
  rate: "-8%"                 # chậm hơn một chút cho cảm xúc

video:
  font: "DejaVu Sans"         # font phải hỗ trợ tiếng Việt
  background_music: ""        # đường dẫn file nhạc không bản quyền (mp3), để trống nếu không dùng
  music_volume: 0.12
  fallback_query: "family warm sunset"

ai_video:
  enabled: true
  # Nguồn video AI:
  #   "manual_flow" = MIỄN PHÍ: bot gửi prompt qua Telegram, bạn tạo clip trên Google Flow
  #                   (labs.google/flow, ~50 credit miễn phí/ngày) rồi reply lại bằng file video
  #   "gemini_api"  = tự động hoàn toàn qua Gemini API (trả phí, cần GEMINI_API_KEY)
  provider: "manual_flow"
  # Cảnh nào dùng AI, còn lại dùng Pixabay:
  #   "first" = chỉ cảnh mở đầu (hook) | "all" = tất cả | "none" = không dùng | [1, 3] = cảnh số 1 và 3
  scenes: "all"
  max_shot_sec: 8             # mỗi shot AI tối đa 8 giây (cảnh dài hơn sẽ tách nhiều shot)

  manual:                     # dùng khi provider = manual_flow
    max_shots_per_day: 4      # 50 credit/ngày ÷ ~12 credit/clip 8s (Omni Flash 720p) ≈ 4 clip
    one_shot_per_scene: true  # mỗi cảnh đúng 1 clip 8s
    max_stretch: 1.25         # lời đọc dài hơn clip thì làm chậm clip tối đa 1.25 lần (không lặp clip)
    credits_per_shot: 12      # chỉ để ghi log ước tính
    daily_credits: 50

  # ---- dùng khi provider = gemini_api ----
  # Veo trên Gemini API đã bị Google tắt ngày 22/10/2026; Omni Flash là model thay thế.
  model: "gemini-omni-1.2-flash"
  resolution: "360p"          # 360p (rẻ nhất, ~$0.023/s) | 720p (~$0.07/s) | 1080p | 4k
  daily_limit_sec: 60         # tối đa số giây video AI mỗi ngày; vượt thì cảnh đó tự chuyển sang Pixabay
  timeout_sec: 900            # chờ tối đa mỗi shot
  poll_interval_sec: 10
  # Giá Gemini Omni 1.2 Flash (USD / 1 triệu token), dùng để ước tính chi phí ghi vào data/logs/ai_cost.jsonl
  price_per_1m_output_tokens: 12.0
  price_per_1m_input_tokens: 1.5

schedule:
  # Giờ chạy thật nằm trong workflow n8n (node "06:30 – kiểm tra kế hoạch" và "07:00 – gửi kịch bản").
  # Dòng dưới chỉ dùng cho bot Python cũ (python -m tiktok_agent.main bot).
  daily_time: "07:00"
  timezone: "Asia/Ho_Chi_Minh"

tiktok:
  # inbox  = đẩy vào hộp nháp TikTok, bạn bấm đăng trong app (dùng được ngay)
  # direct = đăng thẳng (cần app TikTok qua audit, nếu chưa thì chỉ đăng được SELF_ONLY)
  post_mode: "inbox"
  privacy_level: "PUBLIC_TO_EVERYONE"
  # Các kênh TikTok của bạn (tên tự đặt, không dấu, không khoảng trắng). Mỗi kênh kết nối 1 lần bằng lệnh /tiktok.
  # Video được duyệt sẽ được gửi lên TẤT CẢ các kênh đã kết nối.
  accounts:
    - "default"
    # - "kenh2"

# Ngân sách: mọi dịch vụ trả phí phải được bạn duyệt trên Telegram trước khi tiêu tiền.
# Hạn mức tháng = free_monthly_usd + số tiền bạn đã bấm "Duyệt". Vượt hạn mức → bot hỏi trước, không tự tiêu.
budget:
  services:
    claude:                   # Claude API — bắt buộc (viết kế hoạch + kịch bản), ~2–5 USD/tháng
      free_monthly_usd: 0
      suggest_monthly_usd: 5
      est_plan_usd: 0.8       # ước tính 1 lần lập kế hoạch 30 ngày
      est_script_usd: 0.15    # ước tính 1 kịch bản
      price_in_per_m: 4       # Claude Opus 5.5: $4 / 1 triệu token vào
      price_out_per_m: 20     #                  $20 / 1 triệu token ra
    apify:                    # quét đối thủ — gói Free của Apify tặng ~5 USD/tháng nên thường $0
      free_monthly_usd: 5
      suggest_monthly_usd: 2
      est_scrape_usd: 0.5
    gemini_video:             # tuỳ chọn: tạo clip tự động bằng Gemini API thay vì tạo tay trên Google Flow
      free_monthly_usd: 0
      suggest_monthly_usd: 25
      usd_per_clip: 0.19

data_dir: "data"
