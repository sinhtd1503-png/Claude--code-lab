<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" font-family="Be Vietnam Pro, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 1200 620" role="img" aria-label="Sơ đồ kiến trúc: iPad và Telegram gửi tin qua Telegram Bot API tới Caddy trên VPS, Caddy chuyển cho n8n, n8n gọi worker; worker gọi Claude, Gemini, edge-tts, TikTok, Apify và lưu dữ liệu vào SQLite.">
      <rect width="1200" height="620" fill="#f4f6f8"/>
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#18212c" d="M0 0 L10 5 L0 10 z"/></marker>
        <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#b26b00" d="M0 0 L10 5 L0 10 z"/></marker>
      </defs>

      <!-- Column headers -->
      <text fill="#5b6676" font-size="11" font-weight="600" letter-spacing="0.9" x="110" y="40" text-anchor="middle">BẠN · IPAD</text>
      <text fill="#5b6676" font-size="11" font-weight="600" letter-spacing="0.9" x="325" y="40" text-anchor="middle">INTERNET</text>
      <text fill="#5b6676" font-size="11" font-weight="600" letter-spacing="0.9" x="1105" y="40" text-anchor="middle">DỊCH VỤ NGOÀI</text>

      <!-- VPS zone -->
