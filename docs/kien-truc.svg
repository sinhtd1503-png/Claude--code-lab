      <text fill="#5b6676" font-size="11" font-weight="600" letter-spacing="0.9" x="476" y="68">VPS CONTABO · UBUNTU 24.04 · DOCKER COMPOSE</text>

      <!-- Column 1: iPad -->
      <rect fill="#ffffff" stroke="#c9d1dc" stroke-width="1.2" x="40" y="70" width="140" height="56" rx="8"/>
      <text fill="#18212c" font-size="13" font-weight="600" x="110" y="94" text-anchor="middle">Telegram</text>
      <text fill="#5b6676" font-size="11" x="110" y="112" text-anchor="middle">duyệt · gửi clip</text>

      <rect fill="#ffffff" stroke="#c9d1dc" stroke-width="1.2" x="40" y="180" width="140" height="56" rx="8"/>
      <text fill="#18212c" font-size="13" font-weight="600" x="110" y="204" text-anchor="middle">Safari</text>
      <text fill="#5b6676" font-size="11" x="110" y="222" text-anchor="middle">n8n · đăng nhập TikTok</text>

