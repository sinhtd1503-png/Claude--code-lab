      <path stroke="#b26b00" stroke-width="1.4" fill="none" stroke-dasharray="5 4" d="M960 376 H1028" marker-end="url(#ahp)"/><text fill="#b26b00" font-size="11" x="995" y="368" text-anchor="middle">clip AI</text>

