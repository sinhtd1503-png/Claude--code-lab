      <rect fill="#f4f6f8" stroke="#c9d1dc" x="807" y="356" width="141" height="40" rx="6"/><text fill="#18212c" font-size="12" x="817" y="373">ai_video.py</text><text fill="#5b6676" font-size="11" x="817" y="388">clip AI tự động</text>
      <rect fill="#f4f6f8" stroke="#c9d1dc" x="807" y="404" width="141" height="40" rx="6"/><text fill="#18212c" font-size="12" x="817" y="421">video.py</text><text fill="#5b6676" font-size="11" x="817" y="436">FFmpeg, phụ đề</text>
      <rect fill="#f4f6f8" stroke="#c9d1dc" x="807" y="452" width="141" height="40" rx="6"/><text fill="#18212c" font-size="12" x="817" y="469">publisher.py</text><text fill="#5b6676" font-size="11" x="817" y="484">đăng TikTok</text>
      <rect fill="#f4f6f8" stroke="#c9d1dc" x="807" y="500" width="141" height="40" rx="6"/><text fill="#18212c" font-size="12" x="817" y="517">scraper.py</text><text fill="#5b6676" font-size="11" x="817" y="532">quét đối thủ</text>

