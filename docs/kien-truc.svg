      <path stroke="#b26b00" stroke-width="1.4" fill="none" stroke-dasharray="5 4" d="M1030 136 H1070" marker-end="url(#ahp)"/><text fill="#b26b00" font-size="11" x="1078" y="140">có phí: qua</text>
