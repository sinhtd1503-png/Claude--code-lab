      <path stroke="#b26b00" stroke-width="1.4" fill="none" stroke-dasharray="5 4" d="M960 520 H1028" marker-end="url(#ahp)"/><text fill="#b26b00" font-size="11" x="995" y="512" text-anchor="middle">quét</text>

      <!-- Legend -->
